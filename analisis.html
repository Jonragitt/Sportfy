  <link rel="stylesheet" href="shared/styles.css?v=202611132000">
  <style>
    .big { font-size: 2.4rem; font-weight: 800; line-height: 1; }
    .big small { font-size: 1.05rem; color: var(--muted); font-weight: 600; }
    .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
    .hero { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
    .sec { margin-top: 30px; }
    body.con-fondo .sec > h2, body.con-fondo .sec > .lead { color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
    body.con-fondo .sec > .lead { color: rgba(255,255,255,.85); }
    .sec > h2 { margin-bottom: 4px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 12px; }
    .kpi { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .kpi span { font-size: .8rem; color: var(--muted); display: block; }
    .kpi b { font-size: 1.3rem; display: block; }
    .kpi small { font-size: .78rem; color: var(--muted); }
    .kpi.destacado { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .macro-bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; margin: 12px 0 4px; }
    .macro-bar i:nth-child(1) { background: var(--accent); }
    .macro-bar i:nth-child(2) { background: var(--mid); }
    .macro-bar i:nth-child(3) { background: var(--good); }
    .leyenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--muted); }
    .leyenda b { color: var(--text); }
    .punto { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
    .ajuste { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; font-size: .9rem; background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .ajuste p { margin: 0; } .ajuste p + p { margin-top: 4px; }
    select { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); max-width: 100%; }
    ol.prio { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; gap: 10px; }
    ol.prio li { counter-increment: p; display: grid; grid-template-columns: 34px 1fr; gap: 10px; }
    ol.prio li::before { content: counter(p); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; display: grid; place-content: center; }
    ol.prio p { margin: 2px 0 0; }
    .prueba { border-left: 6px solid var(--muted); }
    .prueba.p3 { border-left-color: var(--good); } .prueba.p2 { border-left-color: color-mix(in srgb, var(--good) 55%, var(--mid)); }
    .prueba.p1 { border-left-color: var(--mid); } .prueba.p0 { border-left-color: var(--bad); }
    .prueba-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .prueba-head h3 { margin: 0; }
    .prueba p { margin: 8px 0 0; }
    .foco { font-size: .9rem; color: var(--muted); }
    .grid2 { display: grid; gap: 12px; }
    @media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    .ejercicios { display: grid; gap: 8px; margin-top: 10px; }
    @media (min-width: 560px) { .ejercicios { grid-template-columns: 1fr 1fr; } }
    .ejercicios h4 { margin: 0 0 4px; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .ejercicios ul { margin: 0; padding-left: 18px; }
    .precaucion { margin: 10px 0 0; padding: 8px 12px; border-radius: 10px; font-size: .9rem; background: color-mix(in srgb, var(--mid) 15%, transparent); }
    ul.chips { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .chart { width: 100%; height: auto; display: block; margin-top: 8px; }
    .chart .grid-l { stroke: var(--border); stroke-width: 1; }
    .chart .axis { fill: var(--muted); font-size: 11px; }
    .chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
    .chart .val { fill: var(--text); font-size: 11px; font-weight: 700; }
    .delta { font-weight: 700; font-size: .9rem; }
    .delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta.flat { color: var(--muted); }
    .graficas { display: grid; gap: 12px; }
    @media (min-width: 760px) { .graficas { grid-template-columns: 1fr 1fr; } }
    .graficas .card h3 { margin: 0; }
    .empty { text-align: center; padding: 24px 16px; }
    .empty p { margin: 0 0 12px; color: var(--muted); }
    .empty .btn { text-decoration: none; display: inline-block; margin: 4px; }
    .tabs a { white-space: nowrap; padding: 10px 18px; }
    .tabs.arriba { position: sticky; top: 10px; left: auto; bottom: auto; transform: none; width: fit-content; max-width: 100%; margin: 6px auto 18px; }
    .wrap { padding-bottom: 40px; }
    .guardado { font-size: .85rem; color: var(--good); font-weight: 600; margin: 10px 0 0; }
    @media (max-width: 420px) { .big { font-size: 2rem; } }

    /* Lectura más cómoda: texto algo más grande, más aire y grises más oscuros. */
    main.wrap { font-size: 1.07rem; line-height: 1.6; }
    main.wrap h2 { font-size: 1.5rem; }
    main.wrap .card { padding: 20px 18px; margin: 14px 0; }
    main.wrap .card h3 { font-size: 1.2rem; }
    main.wrap .note, main.wrap .foco { font-size: .97rem; line-height: 1.55; }
    main.wrap .lead { font-size: 1.05rem; }
    main.wrap .sec { margin-top: 40px; }
    main.wrap ul li + li, main.wrap ol li + li { margin-top: 4px; }
    main.wrap p { margin-top: 0; }
    body.con-fondo main.wrap .card { --muted: #3a404b; }
    @media (prefers-color-scheme: dark) { body.con-fondo main.wrap .card { --muted: #c6ccd6; } }
    .kpi span { font-size: .9rem; font-weight: 600; }
    .kpi b { font-size: 1.45rem; margin: 2px 0; }
    .kpi small { font-size: .9rem; line-height: 1.4; display: block; }
    .leyenda { font-size: .95rem; gap: 6px 16px; }
    .ajuste, .precaucion { font-size: 1rem; padding: 12px 14px; }
    ol.prio { gap: 18px; }
    ol.prio li > * + * { margin-top: 4px; }
    .prueba p { margin: 10px 0 0; }
    .ejercicios h4 { font-size: .92rem; }
    .delta { font-size: 1rem; }
    .chart .axis, .chart .val { font-size: 12.5px; }
    /* En el móvil, cada dato en su propia fila: nombre a la izquierda y valor a la derecha. */
    @media (max-width: 560px) {
      .kpis { grid-template-columns: 1fr; gap: 10px; }
      .kpi { display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 12px; padding: 12px 14px; }
      .kpi span { font-size: 1rem; color: var(--text); }
      .kpi b { font-size: 1.35rem; margin: 0; text-align: right; }
      .kpi small { grid-column: 1 / -1; margin-top: 2px; }
      .big { font-size: 2.6rem; }
      .hero { grid-template-columns: 1fr; gap: 8px; }
    }
  </style>
