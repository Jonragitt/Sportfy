<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 96" role="img" aria-label="Forty5">
  <!-- FORTY + un cronómetro con 45 de 60 minutos marcados (3/4 de vuelta) que contiene el 5 -->
  <g fill="currentColor">
    <text x="0" y="72" font-family="'Arial Black','Helvetica Neue',Inter,system-ui,sans-serif" font-weight="900" font-style="italic" font-size="70" letter-spacing="-3">FORTY</text>
  </g>
  <g transform="translate(290 50)">
    <rect x="-7" y="-46" width="14" height="8" rx="2" fill="currentColor"/>
    <rect x="-2.5" y="-40" width="5" height="6" fill="currentColor"/>
    <circle r="34" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="9"/>
    <circle r="34" fill="none" stroke="#e4572e" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="160.2 213.6" transform="rotate(-90)"/>
    <text x="1" y="21" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Inter,system-ui,sans-serif" font-weight="900" font-style="italic" font-size="58" fill="#e4572e">5</text>
  </g>
</svg>
