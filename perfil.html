<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil · Forty5</title>
  <link rel="stylesheet" href="shared/esquinas.css?v=202611051850">
  <link rel="icon" href="shared/logo/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="shared/styles.css?v=202611051935">
  <style>
    .marca { font-weight: 800; letter-spacing: .04em; color: var(--accent); }
    .estado { display: flex; align-items: center; gap: 12px; }
    .estado .big { font-size: 2.2rem; font-weight: 800; line-height: 1; }
    .estado .big small { font-size: 1rem; color: var(--muted); font-weight: 600; }
    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
    .badge.ok { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
    .badge.inc { background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--muted); }
    .ev-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .ev-head h2 { margin: 0; font-size: 1.15rem; }
    body.con-fondo .card.incompleta { background: color-mix(in srgb, color-mix(in srgb, var(--surface) 88%, var(--border)) 78%, transparent); border-style: dashed; }
    .datos { display: grid; grid-template-columns: 1fr auto; margin: 12px 0 0; }
    .datos dt, .datos dd { padding: 8px 0; border-top: 1px solid var(--border); margin: 0; }
    .datos dd { text-align: right; font-weight: 600; }
    .datos dd small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
    .incompleta .datos dd { color: var(--muted); font-weight: 400; font-style: italic; }
    .aviso { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; font-size: .9rem;
      background: color-mix(in srgb, var(--mid) 15%, transparent); }
    .acciones { margin-top: 12px; }
    .acciones a { font-weight: 600; }
    .pts { font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body class="con-esquinas con-fondo">
  <a class="esquina menu" href="index.html" aria-label="Menú principal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11L12 4l8.5 7M6 9.5V20h4.5v-5.5h3V20H18V9.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <main class="wrap">
    <nav class="topbar" aria-label="Navegación">
      <a class="icon-btn" id="atras" href="index.html" aria-label="Volver atrás">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a class="topbar-logo" href="index.html" aria-label="Forty5 · Inicio"><img class="logo-img" src="shared/logo/forty5-titulo.png" alt="Forty5" width="900" height="214"></a>
      <span class="hueco" aria-hidden="true"></span>
    </nav>
    <script>
      document.getElementById("atras").addEventListener("click", (e) => {
        if (history.length > 1 && document.referrer.startsWith(location.origin)) { e.preventDefault(); history.back(); }
      });
    </script>
    <h1>Mi perfil</h1>
    <p class="lead">Aquí se guardan tus resultados cuando los confirmas con el tick verde. Hasta entonces aparecen como incompletos.</p>

    <div class="card" id="resumen"></div>
    <div id="antro"></div>
    <div id="postural"></div>
  </main>

  <nav class="tabs" aria-label="Menú principal">
    <a href="index.html">Inicio</a>
    <a href="perfil.html" aria-current="page">Perfil</a>
  </nav>

  <script type="module">
    import { getScores, totalScore, scoreLabel } from "./shared/scores.js";
    import { pendientes } from "./shared/perfil.js";

    const $ = (s) => document.querySelector(s);
    const fmt = (n, d = 1) => (n == null ? "–" : Number(n).toLocaleString("es-ES", { maximumFractionDigits: d }));
    const dia = (iso) => new Date(iso).toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" });
    const leer = (k) => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } };
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const ultimo = (arr) => arr.filter((r) => r && r.fecha).sort((a, b) => new Date(a.fecha) - new Date(b.fecha)).at(-1);

    const pend = pendientes();
    const antro = ultimo(leer("sportfy.antropometria.historial"));
    const post = ultimo(leer("sportfy.postural.historial"));
    const confirmadas = [antro, post].filter(Boolean).length;

    // Un aviso si hay resultados vistos sin confirmar (más recientes que lo confirmado).
    function avisoPendiente(clave, confirmado, href) {
      const p = pend[clave];
      if (!p || (confirmado && new Date(confirmado.fecha) >= new Date(p))) return "";
      return `<p class="aviso">Tienes resultados${confirmado ? " nuevos" : ""} sin confirmar. <a href="${href}">Vuelve y pulsa el tick verde</a> para guardarlos.</p>`;
    }

    function tarjeta({ titulo, confirmado, filas, extra = "", clave, href, max }) {
      const ok = Boolean(confirmado);
      const nota = ok && confirmado.nota != null ? `${fmt(confirmado.nota)} / ${max} · ${scoreLabel(confirmado.nota, max)}` : ok ? "Sin nota" : "Incompleto";
      return `
        <div class="card ${ok ? "" : "incompleta"}">
          <div class="ev-head">
            <h2>${titulo}</h2>
            ${ok ? `<span class="badge ok">✓ Completado</span>` : `<span class="badge inc">Incompleto</span>`}
          </div>
          <div class="note">${ok ? `Confirmado el ${dia(confirmado.fecha)}` : "Pendiente de confirmar con el tick verde"}</div>
          <dl class="datos">
            <dt>Nota</dt><dd>${nota}</dd>
            ${filas.map(([k, v, sub]) => `<dt>${k}</dt><dd>${ok ? v : "Incompleto"}${ok && sub ? `<small>${esc(sub)}</small>` : ""}</dd>`).join("")}
          </dl>
          ${extra}
          ${avisoPendiente(clave, confirmado, href)}
          <div class="acciones"><a href="${href}">${ok ? "Repetir evaluación →" : "Hacer evaluación →"}</a></div>
        </div>`;
    }

    // ---------- Resumen ----------
    const total = totalScore(getScores());
    const completo = confirmadas === 2;
    $("#resumen").innerHTML = `
      <div class="estado">
        <div class="big">${completo ? `${fmt(total.points)}<small>/25</small>` : "–"}</div>
        <div>
          ${completo ? `<span class="badge ok">✓ Perfil completo</span>` : `<span class="badge inc">Perfil incompleto</span>`}
          <div class="note">${completo ? `Nota total · ${scoreLabel(total.points, 25)}` : `${confirmadas} de 2 evaluaciones confirmadas`}</div>
        </div>
      </div>`;

    // ---------- Antropometría ----------
    const m = (id) => antro?.metricas?.find((x) => x.id === id);
    const met = (id, unidad) => { const x = m(id); return x ? [`${fmt(x.valor)} ${unidad}`, `${x.categoria} · ${x.puntos}/3 pts`] : ["–", "Sin dato (báscula solo de peso)"]; };
    const imc = antro?.informativos?.find((i) => i.id === "imc");
    const d = antro?.datos || {};
    $("#antro").innerHTML = tarjeta({
      titulo: "Evaluación antropométrica", confirmado: antro, clave: "antropometria", href: "modules/antropometria/index.html", max: 15,
      filas: [
        ["Sexo y edad", `${d.sexo === "mujer" ? "Mujer" : "Hombre"}, ${fmt(d.edad, 0)} años`],
        ["Altura", `${fmt(d.altura)} cm`],
        ["Peso", `${fmt(d.peso)} kg`],
        ["IMC", imc ? `${fmt(imc.valor)} kg/m²` : "–", imc?.categoria],
        ["% graso", ...met("grasa", "%")],
        ["% agua", ...met("agua", "%")],
        ["% muscular", ...met("muscular", "%")],
        ["Edad metabólica", ...met("edadMetabolica", "años")],
        ["Grasa visceral", ...met("visceral", "nivel")],
      ],
    });

    // ---------- Postural ----------
    const desv = post?.desviaciones || [];
    const NIVEL = ["Marcada", "Leve"];
    $("#postural").innerHTML = tarjeta({
      titulo: "Evaluación postural", confirmado: post, clave: "postural", href: "modules/postural/index.html", max: 10,
      filas: [
        ["Pruebas correctas", `${16 - desv.length} de 16`],
        ["Desviaciones", desv.length ? `${desv.length}` : "Ninguna"],
      ],
      extra: post && desv.length
        ? `<ul class="chips" style="list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px">${desv
            .sort((a, b) => a.nivel - b.nivel)
            .map((x) => `<li class="tag l${x.nivel}">${esc(x.nombre)} · ${NIVEL[x.nivel]}</li>`).join("")}</ul>`
        : "",
    });
  </script>
</body>
</html>
