  <style>
    .tabs a { white-space: nowrap; padding: 10px 18px; }
    .tabs.arriba { position: sticky; top: 10px; left: auto; bottom: auto; transform: none; width: fit-content; max-width: 100%; margin: 6px auto 18px; }
    .wrap { padding-bottom: 40px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 12px; }
    .kpi { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .kpi span { font-size: .8rem; color: var(--muted); display: block; }
    .kpi b { font-size: 1.3rem; display: block; }
    .kpi small { font-size: .78rem; color: var(--muted); }
    .kpi.destacado { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .macro-bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; margin: 12px 0 4px; }
    .macro-bar i:nth-child(1) { background: var(--accent); }
    .macro-bar i:nth-child(2) { background: var(--mid); }
    .macro-bar i:nth-child(3) { background: var(--good); }
    .leyenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--muted); }
    .leyenda b { color: var(--text); }
    .punto { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
    .selector { display: flex; gap: 6px; margin-top: 4px; }
    .selector button { flex: 1; font: inherit; font-weight: 700; padding: 10px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .selector button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .comida { border-top: 1px solid var(--border); padding: 12px 0 0; margin-top: 12px; }
    .comida:first-of-type { border-top: 0; margin-top: 4px; padding-top: 4px; }
    .comida-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .comida-head h3 { margin: 0; font-size: 1.05rem; }
    .comida-head span { font-weight: 800; white-space: nowrap; }
    .comida .macros { font-size: .82rem; color: var(--muted); margin: 2px 0 6px; }
    .comida ul { margin: 0; padding-left: 18px; }
    .comida .opcion { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); margin: 0 0 6px; }
    .comida .opcion select { flex: 1; min-width: 0; max-width: 100%; font: inherit; color: var(--text); padding: 6px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
    .comida .plato { font-weight: 700; margin: 0 0 4px; }
    .comida li b { white-space: nowrap; }
    .aviso { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; font-size: .9rem; background: color-mix(in srgb, var(--mid) 15%, transparent); }
    .info { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; font-size: .9rem; background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .info p { margin: 0; } .info p + p { margin-top: 6px; }
    .empty { text-align: center; padding: 24px 16px; }
    .empty p { margin: 0 0 12px; color: var(--muted); }
    .empty .btn { text-decoration: none; display: inline-block; }
    select { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  </style>
